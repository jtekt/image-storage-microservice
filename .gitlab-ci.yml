#     script:
#         - docker pull ${CONTAINER_IMAGE_TEST_AARCH64}
#         - docker tag ${CONTAINER_IMAGE_TEST_AARCH64} ${CONTAINER_IMAGE_TAGGED_AARCH64}
#         - docker push ${CONTAINER_IMAGE_TAGGED_AARCH64}

deploy:
    stage: deploy
    rules:
        - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    tags:
        - internal
    script:
        - kubectl config use-context on-premise-gpu-k8s-cluster/gitlab-agent-for-kubernetes:gpu-microk8s
        - kubectl config set-context --current --namespace=${K8S_NAMESPACE}
        - envsubst < kubernetes_manifest.yml | kubectl apply -f -
